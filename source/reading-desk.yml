# 閱讀台目前正在整理的學習題目。
# date 記錄加入草稿夾的日期；state 表示目前整理階段；完成後可補 resolved_date。
year: 2026
sample: false
topics:
  - id: reading-learning
    code: A-01
    name: 排球攻擊揮臂機制
    description: 釐清攻擊動作從步伐、起跳到手臂加速的連續機制。
    items:
        - id: reading-topic-01
          date: 2026-08-29
          title: 排球攻擊揮臂機制
          source: HackMD｜60715009E
          url: /learning/volleyball-attack-arm-swing/
          state: learning
          note: 以 HackMD 原始筆記為主，重新聚焦混排實戰中的發力方式、髖部與身體旋轉、手臂順勢甩出、肩膀負荷與擊球點選擇；新增兩次有球實戰紀錄，根據單腳起跳且距離球較遠時反而能完成揮臂、高球起跳高度足夠但中段才拉臂、較好球點在臉頰旁邊等觀察，將優先問題從單純起跳高度調整為可完成揮臂的球距離與早段拉臂時機；肩膀不適先記為可能涉及旋轉肌群負荷的症狀假說，並保留後續影片與專業評估的必要性。

  - id: cms-understanding
    code: A-02
    name: CMS 前後台理解
    description: 建立前台呈現、後台欄位與規格審查之間的對照。
    items:
      - id: reading-topic-02
        date: 2026-08-29
        title: 前後台欄位對照與規格審查
        source: 待補來源
        url: /learning/cms-content-modeling-field-review/
        state: learning
        note: 公開持續更新的 CMS 學習筆記，先整理前台顯示、後台欄位與規格文件之間的對照關係。

  - id: agentic-transaction
    code: A-03
    name: Agentic Transaction
    description: 理解代理系統如何處理交易一致性與可靠性。
    items:
      - id: reading-topic-03
        date: 2026-08-29
        title: "Agentic Transaction: Towards ACID-Compliant Agent Systems"
        source: 待補來源
        url: /learning/agentic-transaction-acid-agent/
        state: learning
        note: 公開持續更新的研究筆記，從代理系統的可靠執行、語義 ACID、探索／執行／驗證循環、失敗隔離與提交／重試出發，進一步把學術 AI 驗證轉成工作流程的交易邊界、驗證閘門、回滾／補償、持久化 trace 與推動證據包；新增 SAGAS、Transactional Outbox、Temporal、W3C PROV、HELM、τ-bench、Inspect AI 與 The Turing Way 作為搭配閱讀；論文數據、實作程度與工程泛化性仍待逐項核對。

  - id: ai-office-agent-workflow
    code: A-04
    name: AI Agent 文件產出工作流
    description: 理解 AI 如何從整理過的資料庫，推進到可下載、可編輯與可交接的 Office 產出。
    items:
      - id: reading-topic-04
        date: 2026-08-31
        title: "Gemini Notebook Agent：從資料庫到可交付文件的工作流"
        source: 電腦玩物｜Esor Huang
        url: /learning/gemini-notebook-agent-office-workflow/
        state: learning
        note: 以 Gemini Notebook Agent 的 Word、Excel、PPT 實測為入口，先釐清資料庫、提示、人工判斷、驗證與交付物之間的工作流程。

  - id: reflective-thinking-and-role-calibration
    code: A-05
    name: 持續思考與角色校準
    description: 練習把工作、責任、內耗與角色變化寫成可以持續修正的問題，而不是急著下結論。
    items:
      - id: reading-topic-05
        date: 2026-08-31
        title: "在台灣設立實驗室十一年：校準責任、內耗與自己｜思考方式筆記"
        source: Do good science｜Jason Tsai
        url: /learning/lab-eleven-years-reflective-thinking/
        state: learning
        note: 以文章的回顧、承認矛盾、重新定義角色與保留未完成答案為參考，先整理自己真正喜歡的思考方式，以及它能如何用在工作與生活。

  - id: lis-research-content-analysis
    code: A-06
    name: LIS 研究演變與內容分析
    description: 透過長期文獻內容分析，理解圖書資訊學研究的主題、方法與學科邊界如何變化。
    items:
      - id: reading-topic-06
        date: 2026-08-31
        title: "LIS Research 1965–2025：圖書資訊學研究的主題與方法演變"
        source: Journal of Documentation｜Emerald Publishing
        url: /learning/lis-research-1965-2025-content-analysis/
        state: learning
        note: 以 1965–2025 的長期內容分析為入口，先釐清研究資料如何選取、分類如何維持可比性，以及主題與方法的變化可以如何被解讀。

  - id: website-quality-testing
    code: A-07
    name: 網站品質與軟體測試
    description: 以網站能否安心上線為主軸，從需求、風險與測試設計，逐步建立回歸測試、自動化與發布品質觀點。
    items:
      - id: reading-topic-07
        date: 2026-09-04
        title: "網站品質與軟體測試：42 天鐵人挑戰學習路徑"
        source: ChatGPT 對話整理｜HyRead QA 職缺與網站品質學習規劃
        url: /learning/website-quality-testing-roadmap/
        state: learning
        note: 用 42 天、6 個單元把目前的政府網站專案、網站檢核與 Python 應用，接到正規的需求、風險、測試、缺陷、回歸與發布流程；每個單元都設定必會、暫不學、過關產物與新知分流規則，英文則以碎碎念伴走，喜歡或值得回看的內容再升級成文章。
      - id: reading-topic-08
        date: 2026-09-04
        title: "測試基本功：User Story、Test Case 與 Bug Report"
        source: ChatGPT 對話整理｜網站 QA 基礎訓練
        url: /learning/software-testing-basics-test-case-bug-report/
        state: learning
        note: 先學會把使用者需求轉成驗收條件、測試情境、測試案例與缺陷紀錄，並用修正驗證與回歸測試描述「怎麼知道它真的好了」。
      - id: reading-topic-09
        date: 2026-09-04
        title: "測試設計：等價類別、邊界值與風險導向測試"
        source: ChatGPT 對話整理｜網站 QA 基礎訓練
        url: /learning/test-design-boundary-risk-based-testing/
        state: learning
        note: 練習有根據地選擇測試條件，而不是無限增加案例；先掌握等價類別、邊界值、決策表、狀態轉換、探索式測試與風險排序。
      - id: reading-topic-10
        date: 2026-09-04
        title: "Web 自動化測試：Python、Pytest 與 Playwright"
        source: ChatGPT 對話整理｜網站 QA 基礎訓練
        url: /learning/web-automation-python-pytest-playwright/
        state: learning
        note: 將少量且穩定的手動案例轉成可重複執行的 Web 測試，依序學習 locator、assertion、fixture、參數化、失敗證據與 Page Object Model。
      - id: reading-topic-11
        date: 2026-09-04
        title: "發布品質：Git、CI/CD 與 Release Checklist"
        source: ChatGPT 對話整理｜網站 QA 基礎訓練
        url: /learning/release-quality-git-ci-cd-checklist/
        state: learning
        note: 把測試放回真實開發流程，理解版本控制、測試環境、CI 執行、報告、發布判斷與上線後觀察；Appium、Maestro 與 Jenkins 先列為核心之後的延伸。

  - id: mixed-volleyball-positioning
    code: A-08
    name: 混排攻擊與防守站位
    description: 從實戰問題出發，釐清 6 號位防守範圍，以及 2、4 號位在攻擊與攔網後的覆蓋責任。
    items:
      - id: reading-topic-12
        date: 2026-09-06
        title: 混排攻擊與防守站位
        source: 實戰觀察與後續查證
        url: /learning/mixed-volleyball-defense-positioning/
        state: learning
        note: 先整理混排實戰中的防守範圍問題，聚焦 6 號位的防守方式，以及 2、4 號位在攻擊、攔網與回防後如何覆蓋；規則與固定站位仍待查證，先用責任地圖與實戰紀錄逐步確認。

  - id: pain-improvement-research
    code: A-09
    name: 痠痛改善研究
    description: 以家人與自身的下背、肩膀與小腿不適為觀察起點，建立安全、可回顧的放鬆與改善紀錄。
    items:
      - id: reading-topic-13
        date: 2026-09-06
        title: 痠痛改善研究：從下背、肩膀與小腿開始
        source: 個人觀察與對話整理｜下背痠痛討論、研究肩膀放鬆
        url: /learning/pain-improvement-research/
        state: learning
        note: 以 2026 年 3–4 月的家人肩頸、下背與小腿不適觀察為起點，把腰方肌、提肩胛肌、脛前肌等解剖名詞降級為待驗證假說，改用部位、誘發情境、介入方式、當下與隔日反應建立可持續更新的紀錄；同時整理按摩、熱敷、伸展與筋膜槍的安全界線及需要專業評估的警訊。

  - id: presentation-workflow-open-slide
    code: A-10
    name: 簡報製作與 Open-Slide 工作流
    description: 從內容目的、故事線、視覺設計到上台排練，建立可重複的簡報製作流程。
    items:
      - id: reading-topic-14
        date: 2026-09-07
        title: 簡報製作與 open-slide 2.0
        source: open-slide 官方文件與多方簡報設計分享
        url: /learning/presentation-workflow-open-slide/
        state: learning
        note: 從 open-slide 2.0 視覺編輯器分享截圖出發，整理簡報困擾其實同時包含目的、故事結構、視覺輔助與上台呈現；參考 open-slide 官方 GitHub／Inspector 文件、Duarte 故事結構、Garr Reynolds、BFA 簡報流程與中文視覺化教學，先建立「一句話主旨→故事卡片→最小視覺系統→工具迭代→完整排練」的工作流，並為 2026-09-10 的報告安排六張最小骨架與 PDF／現場格式檢查。

  - id: ai-question-judgment-order
    code: A-11
    name: AI 提問與問題判斷
    description: 以情境、目標、限制與暫定判斷整理 AI 提問，依問題狀態切換診斷、設計與驗證方式。
    items:
      - id: reading-topic-15
        date: 2026-09-08
        title: AI 提問判斷順序：情境、目標與診斷／設計／驗證
        source: ChatGPT 對話整理｜AI提問判斷順序
        url: /learning/ai-question-judgment-order/
        state: learning
        note: 從「主觀判斷是否太早」的問題出發，整理情境、目標、限制、感受與原因假設的不同位置；再依問題狀態區分診斷型、設計型與驗證型提問，加入可接受取捨與「先獨立分析、再比較假設」的兩輪問法，避免文字接龍發散；補充 Google、Anthropic、OpenAI、Simon Willison 與 Tom's Guide 的提示設計、迭代測試、高訊號 context、代表性範例與建設性反駁經驗。
